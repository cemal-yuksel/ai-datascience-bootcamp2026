<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">XGBOOST REGRESSOR'UN KALP ATIŞI</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Her tur aynı beş adım: başla → hatayı bul → ağaç kur → düzelt → tekrarla</text>

<rect x="50" y="170" width="256" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#F6B84B" stroke-width="2"/>
<text x="178.0" y="229.5" text-anchor="middle" font-size="22" font-weight="800" fill="#F6B84B" >1 · Başlangıç</text>
<text x="178.0" y="256.7" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >herkese aynı tahmin:</text>
<text x="178.0" y="281.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >fiyatların ortalaması</text>
<path d="M310 245 L350 245" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="355" y="170" width="256" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#F472B6" stroke-width="2"/>
<text x="483.0" y="229.5" text-anchor="middle" font-size="22" font-weight="800" fill="#F472B6" >2 · Hata</text>
<text x="483.0" y="256.7" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >artık = gerçek − tahmin</text>
<text x="483.0" y="281.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >kim ne kadar yanlış?</text>
<path d="M615 245 L655 245" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="660" y="170" width="256" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#38BDF8" stroke-width="2" filter="url(#parilti)"/>
<text x="788.0" y="229.5" text-anchor="middle" font-size="22" font-weight="800" fill="#38BDF8" >3 · Ağaç</text>
<text x="788.0" y="256.7" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >artıkları en iyi ayıran</text>
<text x="788.0" y="281.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >küçük bir soru seç</text>
<path d="M920 245 L960 245" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="965" y="170" width="256" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#34D399" stroke-width="2"/>
<text x="1093.0" y="229.5" text-anchor="middle" font-size="22" font-weight="800" fill="#34D399" >4 · Yaprak</text>
<text x="1093.0" y="256.7" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >her yaprağa bir düzeltme</text>
<text x="1093.0" y="281.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >(artıkların frenli ortalaması)</text>
<path d="M1225 245 L1265 245" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="1270" y="170" width="256" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#A78BFA" stroke-width="2"/>
<text x="1398.0" y="229.5" text-anchor="middle" font-size="22" font-weight="800" fill="#A78BFA" >5 · Güncelle</text>
<text x="1398.0" y="256.7" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >tahmin += η × düzeltme</text>
<text x="1398.0" y="281.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >başa dön ↻</text>
<path d="M1420 330 C1300 440 450 440 190 330" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="2.2s" repeatCount="indefinite"/></path>
<text x="800" y="468" text-anchor="middle" font-size="19" font-weight="700" fill="#F6B84B" >M tur boyunca tekrar</text>
<text x="800" y="520" text-anchor="middle" font-size="24" font-weight="800" fill="#F8FAFC" >Son tahmin  F(x) = F₀ + η·T₁(x) + η·T₂(x) + … + η·T_M(x)</text>
<rect x="1" y="1" width="1598" height="568" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
