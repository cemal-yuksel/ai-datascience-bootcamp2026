<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">HATAYI NASIL ÖLÇERİZ?</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Aynı üç ev, üç farklı bakış açısı</text>

<rect x="110" y="336" width="62" height="124" rx="8" fill="#F6B84B" opacity="0.88"/><rect x="178" y="324" width="62" height="136" rx="8" fill="#38BDF8" opacity="0.88"/>
<text x="175" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#CBD5E1" >Ev 1</text>
<text x="141" y="326.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >200</text>
<text x="209" y="313.6" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >220</text>
<text x="175" y="525" text-anchor="middle" font-size="17" font-weight="800" fill="#F472B6" >hata 20</text>
<rect x="300" y="274" width="62" height="186" rx="8" fill="#F6B84B" opacity="0.88"/><rect x="368" y="299" width="62" height="161" rx="8" fill="#38BDF8" opacity="0.88"/>
<text x="365" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#CBD5E1" >Ev 2</text>
<text x="331" y="264.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >300</text>
<text x="399" y="288.8" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >260</text>
<text x="365" y="525" text-anchor="middle" font-size="17" font-weight="800" fill="#F472B6" >hata 40</text>
<rect x="490" y="150" width="62" height="310" rx="8" fill="#F6B84B" opacity="0.88"/><rect x="558" y="212" width="62" height="248" rx="8" fill="#38BDF8" opacity="0.88"/>
<text x="555" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#CBD5E1" >Ev 3</text>
<text x="521" y="140.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >500</text>
<text x="589" y="202.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F8FAFC" >400</text>
<text x="555" y="525" text-anchor="middle" font-size="17" font-weight="800" fill="#F472B6" >hata 100</text>
<text x="330" y="150" text-anchor="middle" font-size="17" font-weight="600" fill="#94A3B8" >■ gerçek   ■ tahmin (bin $)</text>
<rect x="700" y="150" width="270" height="170" rx="18" fill="#0B1026" opacity="0.9" stroke="#38BDF8" stroke-width="2"/>
<text x="835.0" y="208.95" text-anchor="middle" font-size="26" font-weight="800" fill="#38BDF8" >MAE</text>
<text x="835.0" y="238.14999999999998" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >ortalama |hata|</text>
<text x="835.0" y="262.45" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >(20+40+100) / 3</text>
<text x="835.0" y="286.75" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >≈ 53 bin $</text>
<rect x="990" y="150" width="270" height="170" rx="18" fill="#0B1026" opacity="0.9" stroke="#F472B6" stroke-width="2" filter="url(#parilti)"/>
<text x="1125.0" y="208.95" text-anchor="middle" font-size="26" font-weight="800" fill="#F472B6" >RMSE</text>
<text x="1125.0" y="238.14999999999998" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >büyük hatayı cezalandırır</text>
<text x="1125.0" y="262.45" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >√((20²+40²+100²)/3)</text>
<text x="1125.0" y="286.75" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >≈ 63 bin $</text>
<rect x="1280" y="150" width="260" height="170" rx="18" fill="#0B1026" opacity="0.9" stroke="#34D399" stroke-width="2"/>
<text x="1410.0" y="208.95" text-anchor="middle" font-size="26" font-weight="800" fill="#34D399" >R²</text>
<text x="1410.0" y="238.14999999999998" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >“ortalamayı söyleyen”e</text>
<text x="1410.0" y="262.45" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >göre ne kadar iyiyiz?</text>
<text x="1410.0" y="286.75" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >1 mükemmel, 0 taban</text>
<rect x="700" y="345" width="840" height="150" rx="18" fill="#0B1026" opacity="0.9" stroke="#F6B84B" stroke-width="2"/>
<text x="1120.0" y="405.3" text-anchor="middle" font-size="24" font-weight="800" fill="#F6B84B" >Ana ölçütümüz: RMSE</text>
<text x="1120.0" y="433.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >Pahalı bir mahallede büyük yanılmak, ucuzda küçük yanılmaktan daha acıdır;</text>
<text x="1120.0" y="457.8" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >RMSE bunu yansıtır. MAE ve R² ile birlikte okuruz, çünkü tek sayı her şeyi söylemez.</text>
<rect x="1" y="1" width="1598" height="568" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
