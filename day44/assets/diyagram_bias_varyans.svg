<text x="800" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#C084FC" letter-spacing="5">VARYANS ve BIAS</text><text x="800" y="122" text-anchor="middle" font-size="40" font-weight="800" fill="#F8FAFC" >Tek ağaç ezberler (yüksek varyans), orman dengeyi kurar</text><rect x="70" y="140" width="460" height="330" rx="24" fill="#F25F70" fill-opacity="0.09" stroke="#F25F70" stroke-width="2.2"/><text x="300" y="215" text-anchor="middle" font-size="60" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🌳</text><text x="300" y="262" text-anchor="middle" font-size="26" font-weight="800" fill="#F25F70" >Tek karar ağacı</text><text x="300" y="304" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0" >Eğitimde ≈ %100, testte düşük</text><rect x="120" y="326" width="360" height="40" rx="20.0" fill="#F25F70" fill-opacity="0.14" stroke="#F25F70" stroke-opacity="0.75" stroke-width="1.5"/><text x="300.0" y="351.95" text-anchor="middle" font-size="17" font-weight="700" fill="#F25F70" >Düşük bias · YÜKSEK varyans</text><text x="300" y="410" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >Veri biraz değişince bambaşka bir ağaç çıkar.</text><circle cx="300" cy="445" r="5" fill="#F25F70"><animate attributeName="cx" values="160;440;200;400;160" dur="3s" repeatCount="indefinite"/></circle><line x1="130" y1="445" x2="470" y2="445" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/><circle cx="300" cy="445" r="9" fill="none" stroke="#F25F70" stroke-width="2"/><rect x="575" y="140" width="460" height="330" rx="24" fill="#4ADE80" fill-opacity="0.09" stroke="#4ADE80" stroke-width="2.2"/><text x="805" y="215" text-anchor="middle" font-size="60" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🌲</text><text x="805" y="262" text-anchor="middle" font-size="26" font-weight="800" fill="#4ADE80" >Random Forest</text><text x="805" y="304" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0" >Eğitim ve test birbirine yakın</text><rect x="625" y="326" width="360" height="40" rx="20.0" fill="#4ADE80" fill-opacity="0.14" stroke="#4ADE80" stroke-opacity="0.75" stroke-width="1.5"/><text x="805.0" y="351.95" text-anchor="middle" font-size="17" font-weight="700" fill="#4ADE80" >Düşük bias · DÜŞÜK varyans</text><text x="805" y="410" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >Hatalar farklı yönlere dağılır, ortalamada birbirini söndürür.</text><circle cx="805" cy="445" r="5" fill="#4ADE80"><animate attributeName="cx" values="785;825;795;815;785" dur="3s" repeatCount="indefinite"/></circle><line x1="635" y1="445" x2="975" y2="445" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/><circle cx="805" cy="445" r="9" fill="none" stroke="#4ADE80" stroke-width="2"/><rect x="1080" y="140" width="460" height="330" rx="24" fill="#F6B84B" fill-opacity="0.09" stroke="#F6B84B" stroke-width="2.2"/><text x="1310" y="215" text-anchor="middle" font-size="60" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🚀</text><text x="1310" y="262" text-anchor="middle" font-size="26" font-weight="800" fill="#F6B84B" >Boosting</text><text x="1310" y="304" text-anchor="middle" font-size="17" font-weight="600" fill="#E2E8F0" >Ardışık düzeltme</text><rect x="1130" y="326" width="360" height="40" rx="20.0" fill="#F6B84B" fill-opacity="0.14" stroke="#F6B84B" stroke-opacity="0.75" stroke-width="1.5"/><text x="1310.0" y="351.95" text-anchor="middle" font-size="17" font-weight="700" fill="#F6B84B" >Önce bias'ı düşürür</text><text x="1310" y="410" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >Zayıf modelleri art arda ekleyerek hatayı küçültür.</text><circle cx="1170" cy="445" r="5" fill="#F6B84B"><animate attributeName="cx" values="1170;1250;1295;1308;1310" dur="3s" repeatCount="indefinite"/></circle><line x1="1140" y1="445" x2="1480" y2="445" stroke="#FFFFFF" stroke-opacity="0.15" stroke-width="2"/><circle cx="1310" cy="445" r="9" fill="none" stroke="#F6B84B" stroke-width="2"/><rect x="400" y="495" width="800" height="40" rx="20.0" fill="#C084FC" fill-opacity="0.14" stroke="#C084FC" stroke-opacity="0.75" stroke-width="1.5"/><text x="800.0" y="520.6" text-anchor="middle" font-size="16" font-weight="700" fill="#C084FC" >Beklenen hata = Bias² + Varyans + Gürültü  ·  İkisini aynı anda düşürmek zordur</text>
