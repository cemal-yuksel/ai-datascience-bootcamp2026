, sans-serif">🌳</text><text x="1057.7017542195958" y="483.57797401561584" font-size="21" font-weight="800" fill="#F6B84B" text-anchor="start" >3 · Ağaç</text><text x="1057.7017542195958" y="513.5779740156158" font-size="14.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >artıkları gruplara ayır</text><rect x="362" y="440" width="250" height="104" rx="18" fill="#0F1B2D" stroke="#34D399" stroke-width="2.5"/><text x="399.29824578040433" y="503.57797401561584" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🍂</text><text x="432.29824578040433" y="483.57797401561584" font-size="21" font-weight="800" fill="#34D399" text-anchor="start" >4 · Yaprak değeri</text><text x="432.29824578040433" y="513.5779740156158" font-size="14.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >Σartık / (Σbelirsizlik + λ)</text><rect x="169" y="244" width="250" height="104" rx="18" fill="#0F1B2D" stroke="#A78BFA" stroke-width="2.5"/><text x="206.03793333097826" y="307.9220259843842" font-size="34" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔄</text><text x="239.03793333097826" y="287.9220259843842" font-size="21" font-weight="800" fill="#A78BFA" text-anchor="start" >5 · Güncelle</text><text x="239.03793333097826" y="317.9220259843842" font-size="14.5" font-weight="500" fill="#CBD5E1" text-anchor="start" >log-odds += η × değer</text><text x="800" y="372" font-size="22" font-weight="600" fill="#94A3B8" text-anchor="middle" >tekrar</text><text x="800" y="422" font-size="40" text-anchor="middle" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🔁</text>
