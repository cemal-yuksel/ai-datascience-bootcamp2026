<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">SIZINTI VE KISAYOL ADAYLARI</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Her sütun &#x27;nesnenin özelliği&#x27; değildir</text>
<rect x="60" y="150" width="460" height="250" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="290.0" y="239.5" text-anchor="middle" font-size="20" font-weight="800" fill="#34D399" >Fiziksel ölçümler ✔</text>
<text x="290.0" y="267.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >u, g, r, i, z, renk indeksleri</text>
<text x="290.0" y="292.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >redshift (spektrumdan)</text>
<text x="290.0" y="317.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >→ nesneyi anlatır</text>
<rect x="570" y="150" width="460" height="250" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" />
<text x="800.0" y="239.5" text-anchor="middle" font-size="20" font-weight="800" fill="#F6B84B" >Gözlem kimlikleri ⚠</text>
<text x="800.0" y="267.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >plate, mjd, fiberid, specobjid</text>
<text x="800.0" y="292.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >objid, run, rerun, camcol, field</text>
<text x="800.0" y="317.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >→ nesneyi değil, gözlemi anlatır</text>
<rect x="1080" y="150" width="460" height="250" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="1310.0" y="239.5" text-anchor="middle" font-size="20" font-weight="800" fill="#F472B6" >Konum ❓</text>
<text x="1310.0" y="267.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >ra, dec</text>
<text x="1310.0" y="292.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >gökyüzünde bölge → belirli</text>
<text x="1310.0" y="317.5" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >taramaların hedef seçimi</text>
<text x="800" y="470" text-anchor="middle" font-size="19" font-weight="700" fill="#F8FAFC" >Kimlik benzeri sütunlar eğitimde sınıfı &#x27;ezberletebilir&#x27; (plakaya göre hedef seçimi) ama yeni bir gözlemde işe yaramaz.</text>
<text x="800" y="510" text-anchor="middle" font-size="18" font-weight="500" fill="#94A3B8" >Bunu bölüm 5&#x27;te plaka bazlı bölmeyle ölçüyoruz.</text>
<rect x="1" y="1" width="1598" height="558" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
