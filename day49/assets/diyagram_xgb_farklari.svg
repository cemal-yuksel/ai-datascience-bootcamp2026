<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">GRADIENT BOOSTING → XGBOOST</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >XGBoost&#x27;u farklı kılan beş ek parça</text>
<rect x="40" y="150" width="280" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="180.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✂️</text>
<text x="180.0" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#F472B6" >Budama</text>
<text x="180.0" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >ağaçlar sonradan</text>
<text x="180.0" y="278" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >(post-pruning) kırpılır</text>
<text x="180.0" y="302" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >γ eşiği</text>
<rect x="348" y="150" width="280" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#38BDF8" stroke-width="2" />
<text x="488.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🛡️</text>
<text x="488.0" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#38BDF8" >Düzenleme</text>
<text x="488.0" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >L1 / L2 cezası</text>
<text x="488.0" y="278" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >λ, α: aşırı öğrenme</text>
<text x="488.0" y="302" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >riskini azaltır</text>
<rect x="656" y="150" width="280" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" />
<text x="796.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⚡</text>
<text x="796.0" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#F6B84B" >Hız</text>
<text x="796.0" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >paralel bölünme</text>
<text x="796.0" y="278" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >histogram, bellek</text>
<text x="796.0" y="302" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >optimizasyonu</text>
<rect x="964" y="150" width="280" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="1104.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧮</text>
<text x="1104.0" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#34D399" >Gain ve benzerlik</text>
<text x="1104.0" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >bölünme kalitesi</text>
<text x="1104.0" y="278" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >S = (ΣR)² / (H+λ)</text>
<text x="1104.0" y="302" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >ile ölçülür</text>
<rect x="1272" y="150" width="280" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#A78BFA" stroke-width="2" />
<text x="1412.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎲</text>
<text x="1412.0" y="226" text-anchor="middle" font-size="20" font-weight="800" fill="#A78BFA" >Sigmoid + log-odds</text>
<text x="1412.0" y="254" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >sınıflamada tahmin</text>
<text x="1412.0" y="278" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >log-odds&#x27;ta tutulur,</text>
<text x="1412.0" y="302" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >sigmoid ile p&#x27;ye döner</text>
<text x="800" y="490" text-anchor="middle" font-size="21" font-weight="700" fill="#F8FAFC" >Hepsinin ortak amacı: hem hatayı hem de model karmaşıklığını birlikte küçültmek.</text>
