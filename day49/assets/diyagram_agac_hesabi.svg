<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">PDF&#x27;TEKİ ÖRNEK AĞAÇ</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Maaş ≤ 50K sorusu: sol 3 kişi, sağ 4 kişi; gain = 1,511</text>
<rect x="600" y="130" width="400" height="90" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" filter="url(#parilti)"/>
<text x="800.0" y="166.9" text-anchor="middle" font-size="24" font-weight="800" fill="#F6B84B" >Maaş ≤ 50K ?</text>
<text x="800.0" y="194.9" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >kök: ΣR = 0 → S = 0</text>
<rect x="260" y="340" width="380" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="450.0" y="382.5" text-anchor="middle" font-size="20" font-weight="800" fill="#F472B6" >Sol yaprak (ID 1,2,3)</text>
<text x="450.0" y="410.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ΣR = −1,142 · H = 0,612</text>
<text x="450.0" y="433.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >S = 0,809</text>
<text x="450.0" y="456.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >yaprak V = −0,709</text>
<rect x="960" y="340" width="380" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="1150.0" y="382.5" text-anchor="middle" font-size="20" font-weight="800" fill="#34D399" >Sağ yaprak (ID 4,5,6,7)</text>
<text x="1150.0" y="410.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ΣR = +1,144 · H = 0,816</text>
<text x="1150.0" y="433.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >S = 0,702</text>
<text x="1150.0" y="456.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >yaprak V = +0,631</text>
<path d="M760 222 L480 340" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="620.0" y="271.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F472B6" >evet</text>
<path d="M840 222 L1150 340" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="995.0" y="271.0" text-anchor="middle" font-size="15" font-weight="700" fill="#34D399" >hayır</text>
<text x="800" y="560" text-anchor="middle" font-size="24" font-weight="800" fill="#F8FAFC" >Gain = S_sol + S_sağ − S_kök = 0,809 + 0,702 − 0 = 1,511</text>
<text x="800" y="596" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >Benzerlik S = (ΣR)² / (Σp(1−p) + λ),  yaprak V = ΣR / (Σp(1−p) + λ),  λ = 1</text>
