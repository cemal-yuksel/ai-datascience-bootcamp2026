<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">SDSS: IŞIĞI BEŞ RENKTE ÖLÇMEK</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Teleskop her nesneyi u, g, r, i, z filtrelerinden ayrı ayrı ölçer</text>
<rect x="60" y="150" width="170" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#A78BFA" stroke-width="2" />
<text x="145.0" y="214.8" text-anchor="middle" font-size="48" font-weight="800" fill="#A78BFA" >u</text>
<text x="145.0" y="242.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >ultraviyole</text>
<text x="145.0" y="264.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >parlaklık (mag)</text>
<rect x="260" y="150" width="170" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" filter="url(#parilti)"/>
<text x="345.0" y="214.8" text-anchor="middle" font-size="48" font-weight="800" fill="#34D399" >g</text>
<text x="345.0" y="242.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >yeşil</text>
<text x="345.0" y="264.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >parlaklık (mag)</text>
<rect x="460" y="150" width="170" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F87171" stroke-width="2" />
<text x="545.0" y="214.8" text-anchor="middle" font-size="48" font-weight="800" fill="#F87171" >r</text>
<text x="545.0" y="242.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >kırmızı</text>
<text x="545.0" y="264.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >parlaklık (mag)</text>
<rect x="660" y="150" width="170" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#FB923C" stroke-width="2" />
<text x="745.0" y="214.8" text-anchor="middle" font-size="48" font-weight="800" fill="#FB923C" >i</text>
<text x="745.0" y="242.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >yakın kızılötesi</text>
<text x="745.0" y="264.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >parlaklık (mag)</text>
<rect x="860" y="150" width="170" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="945.0" y="214.8" text-anchor="middle" font-size="48" font-weight="800" fill="#F472B6" >z</text>
<text x="945.0" y="242.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >kızılötesi</text>
<text x="945.0" y="264.8" text-anchor="middle" font-size="15" font-weight="500" fill="#CBD5E1" >parlaklık (mag)</text>
<rect x="1090" y="150" width="450" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" />
<text x="1315.0" y="205.1" text-anchor="middle" font-size="26" font-weight="800" fill="#F6B84B" >Renk indeksi</text>
<text x="1315.0" y="233.1" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >u−g, g−r, r−i, i−z</text>
<text x="1315.0" y="257.1" text-anchor="middle" font-size="17" font-weight="500" fill="#CBD5E1" >komşu iki filtrenin farkı → sıcaklık ipucu</text>
<path d="M1020 225 L1090 225" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="60" y="350" width="700" height="140" rx="18" fill="#0B1026" opacity="0.88" stroke="#38BDF8" stroke-width="2" />
<text x="410.0" y="397.0" text-anchor="middle" font-size="20" font-weight="800" fill="#38BDF8" >Magnitüd tersine işler</text>
<text x="410.0" y="425.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >küçük sayı = parlak nesne</text>
<text x="410.0" y="450.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >u=17 olan nesne, u=19 olandan ≈ 6 kat parlaktır</text>
<rect x="840" y="350" width="700" height="140" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="1190.0" y="397.0" text-anchor="middle" font-size="20" font-weight="800" fill="#34D399" >Redshift (z)</text>
<text x="1190.0" y="425.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >ışığın kırmızıya kayma miktarı</text>
<text x="1190.0" y="450.0" text-anchor="middle" font-size="18" font-weight="500" fill="#CBD5E1" >yıldız ≈ 0; galaksi küçük; kuasar çok uzak ve büyük</text>
<text x="800" y="535" text-anchor="middle" font-size="18" font-weight="500" fill="#94A3B8" >Redshift spektrumdan gelir; yalnız fotometrik (u,g,r,i,z) çalışmak daha zor ve gerçekçi bir senaryodur.</text>
<rect x="1" y="1" width="1598" height="558" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
