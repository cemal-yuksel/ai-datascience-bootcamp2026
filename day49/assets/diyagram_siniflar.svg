<text x="800" y="490" text-anchor="middle" font-size="19" font-weight="700" fill="#F8FAFC" >Dengesiz sınıf: kuasarları kaçırmak &#x27;doğruluk&#x27;ta görünmez; bu yüzden macro-F1 ve sınıf bazlı geri çağırma de izlenir.</text>
