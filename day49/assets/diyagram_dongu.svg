<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">XGBOOST&#x27;UN KALP ATIŞI</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Her tur aynı beş adım: başla → hatayı bul → ağaç kur → düzelt → tekrarla</text>
<rect x="50" y="170" width="255" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" />
<text x="177.5" y="212.5" text-anchor="middle" font-size="20" font-weight="800" fill="#F6B84B" >1 · Başlangıç</text>
<text x="177.5" y="240.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >Herkese aynı tahmin</text>
<text x="177.5" y="263.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >log-odds (sınıflama)</text>
<text x="177.5" y="286.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ortalama (regresyon)</text>
<path d="M308 245 L350 245" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="355" y="170" width="255" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="482.5" y="212.5" text-anchor="middle" font-size="20" font-weight="800" fill="#F472B6" >2 · Hata</text>
<text x="482.5" y="240.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >gerçek − tahmin</text>
<text x="482.5" y="263.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >artık = negatif gradyan</text>
<text x="482.5" y="286.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >g ve h hesaplanır</text>
<path d="M613 245 L655 245" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="660" y="170" width="255" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#38BDF8" stroke-width="2" filter="url(#parilti)"/>
<text x="787.5" y="212.5" text-anchor="middle" font-size="20" font-weight="800" fill="#38BDF8" >3 · Ağaç</text>
<text x="787.5" y="240.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >en yüksek gain&#x27;li</text>
<text x="787.5" y="263.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >bölünmeyi seç</text>
<text x="787.5" y="286.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >benzerlik skoru</text>
<path d="M918 245 L960 245" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="965" y="170" width="255" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="1092.5" y="212.5" text-anchor="middle" font-size="20" font-weight="800" fill="#34D399" >4 · Yaprak</text>
<text x="1092.5" y="240.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >her yaprağa bir değer</text>
<text x="1092.5" y="263.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ΣR / (Σp(1−p)+λ)</text>
<text x="1092.5" y="286.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" ></text>
<path d="M1223 245 L1265 245" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<rect x="1270" y="170" width="255" height="150" rx="18" fill="#0B1026" opacity="0.88" stroke="#A78BFA" stroke-width="2" />
<text x="1397.5" y="212.5" text-anchor="middle" font-size="20" font-weight="800" fill="#A78BFA" >5 · Güncelle</text>
<text x="1397.5" y="240.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >F ← F + η · yaprak</text>
<text x="1397.5" y="263.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >sigmoid ile olasılık</text>
<text x="1397.5" y="286.5" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >başa dön ↺</text>
<path d="M1425 325 Q800.0 420.0 175 325" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="800.0" y="362.5" text-anchor="middle" font-size="15" font-weight="700" fill="#F6B84B" >M tur boyunca tekrar</text>
<text x="800" y="520" text-anchor="middle" font-size="21" font-weight="700" fill="#F8FAFC" >Final tahmin  F(x) = F₀ + η·H₁(x) + η·H₂(x) + … + η·H_M(x)   →   p = 1 / (1 + e^(−F))</text>
<rect x="1" y="1" width="1598" height="558" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
