<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">DÜZENLEME DÜĞMELERİ</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Üç koruma: değerleri küçült, zayıf bölünmeyi reddet, bilgisiz düğümü kes</text>
<rect x="60" y="150" width="470" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#38BDF8" stroke-width="2" />
<text x="295.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎚️</text>
<text x="295.0" y="226" text-anchor="middle" font-size="24" font-weight="800" fill="#38BDF8" >λ (lambda)</text>
<text x="295.0" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >yaprak değerini küçültür</text>
<text x="295.0" y="280" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >V = ΣR / (H + λ)</text>
<text x="295.0" y="306" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >λ↑ → daha temkinli model</text>
<rect x="570" y="150" width="470" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="805.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">✂️</text>
<text x="805.0" y="226" text-anchor="middle" font-size="24" font-weight="800" fill="#F472B6" >γ (gamma)</text>
<text x="805.0" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >minimum gain şartı</text>
<text x="805.0" y="280" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >gain &lt; γ ise bölünme yok</text>
<text x="805.0" y="306" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >→ ağaç budanır</text>
<rect x="1080" y="150" width="470" height="270" rx="18" fill="#0B1026" opacity="0.88" stroke="#34D399" stroke-width="2" />
<text x="1315.0" y="190" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🧺</text>
<text x="1315.0" y="226" text-anchor="middle" font-size="24" font-weight="800" fill="#34D399" >cover / min_child_weight</text>
<text x="1315.0" y="254" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >düğümün taşıdığı bilgi</text>
<text x="1315.0" y="280" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >Σp(1−p) çok küçükse</text>
<text x="1315.0" y="306" text-anchor="middle" font-size="19" font-weight="500" fill="#CBD5E1" >bölünme önerilmez</text>
<text x="800" y="495" text-anchor="middle" font-size="20" font-weight="700" fill="#F8FAFC" >λ = 0 ve γ = 0 olsaydı model klasik Gradient Boosting&#x27;e yaklaşırdı; düzenleme farkı yaratır.</text>
<rect x="1" y="1" width="1598" height="558" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
