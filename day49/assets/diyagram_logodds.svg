<text x="800.0" y="52" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" letter-spacing="5">OLASILIK  ⇄  LOG-ODDS</text>
<text x="800.0" y="100" text-anchor="middle" font-size="24" font-weight="700" fill="#F8FAFC" >Ağaçlar log-odds dünyasında toplanır, sigmoid onu olasılığa çevirir</text>
<rect x="70" y="160" width="300" height="170" rx="18" fill="#0B1026" opacity="0.88" stroke="#F6B84B" stroke-width="2" />
<text x="220.0" y="200" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎲</text>
<text x="220.0" y="236" text-anchor="middle" font-size="20" font-weight="800" fill="#F6B84B" >Olasılık p</text>
<text x="220.0" y="264" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >0 ile 1 arası</text>
<text x="220.0" y="287" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ör. %71,4 onay</text>
<rect x="650" y="160" width="300" height="170" rx="18" fill="#0B1026" opacity="0.88" stroke="#F472B6" stroke-width="2" />
<text x="800.0" y="200" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">⚖️</text>
<text x="800.0" y="236" text-anchor="middle" font-size="20" font-weight="800" fill="#F472B6" >Oran (odds)</text>
<text x="800.0" y="264" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >p / (1−p)</text>
<text x="800.0" y="287" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >5/2 = 2,5</text>
<rect x="1230" y="160" width="300" height="170" rx="18" fill="#0B1026" opacity="0.88" stroke="#38BDF8" stroke-width="2" />
<text x="1380.0" y="200" text-anchor="middle" font-size="30" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">📏</text>
<text x="1380.0" y="236" text-anchor="middle" font-size="20" font-weight="800" fill="#38BDF8" >Log-odds F</text>
<text x="1380.0" y="264" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >log(2,5) ≈ 0,916</text>
<text x="1380.0" y="287" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >−∞ ile +∞ arası</text>
<path d="M370 220 L650 220" fill="none" stroke="#F6B84B" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#okAltin)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="510.0" y="210.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F6B84B" >oranla</text>
<path d="M950 220 L1230 220" fill="none" stroke="#F472B6" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="1090.0" y="210.0" text-anchor="middle" font-size="15" font-weight="700" fill="#F472B6" >logaritma</text>
<path d="M1230 285 Q800.0 405.0 370 285" fill="none" stroke="#34D399" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#ok)"><animate attributeName="stroke-dashoffset" values="20;0" dur="1.3s" repeatCount="indefinite"/></path>
<text x="800.0" y="335.0" text-anchor="middle" font-size="15" font-weight="700" fill="#34D399" >sigmoid: p = 1 / (1 + e^(−F))</text>
<text x="800" y="440" text-anchor="middle" font-size="20" font-weight="600" fill="#E2E8F0" >Ağaçların çıktıları log-odds&#x27;a eklenir (toplanır); en sonda tek bir sigmoid ile olasılık elde edilir.</text>
<text x="800" y="478" text-anchor="middle" font-size="18" font-weight="500" fill="#94A3B8" >Bu sayede üst üste eklenen küçük düzeltmeler hiçbir zaman 0–1 sınırını aşmaz.</text>
<rect x="1" y="1" width="1598" height="518" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>
</svg>
