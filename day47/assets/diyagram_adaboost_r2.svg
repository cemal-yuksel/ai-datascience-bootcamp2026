<text x="800" y="66" text-anchor="middle" font-size="17" font-weight="700" fill="#22D3EE" letter-spacing="5">ADABOOST.R2  ·  DÖNGÜ</text><text x="800" y="122" text-anchor="middle" font-size="36" font-weight="800" fill="#F8FAFC" >Her turda zor örneklere biraz daha fazla dikkat</text><rect x="60" y="190" width="280" height="190" rx="20" fill="#0F1535" stroke="#A78BFA" stroke-width="2.2" filter="url(#parilti)"/><rect x="60" y="190" width="280" height="190" rx="20" fill="#A78BFA" fill-opacity="0.08"/><text x="200.0" y="242" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >🎲</text><text x="200.0" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" >1  Ağırlıklı örnekleme</text><text x="200.0" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >wᵢ'ye göre bootstrap</text><text x="200.0" y="329" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >çek (yüksek wᵢ → sık)</text><rect x="60" y="190" width="280" height="190" rx="20" fill="none" stroke="#A78BFA" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></rect><path d="M344,285 H416" fill="none" stroke="#A78BFA" stroke-width="3" stroke-opacity="0.35" marker-end="url(#ok)"/><path d="M344,285 H416" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="10 80" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="234;0" dur="2.0s" repeatCount="indefinite"/></path><circle r="5" fill="#A78BFA" filter="url(#parilti)"><animateMotion dur="1.8s" begin="0.0s" repeatCount="indefinite" path="M344,285 H416"/></circle><rect x="360" y="190" width="280" height="190" rx="20" fill="#0F1535" stroke="#60A5FA" stroke-width="2.2" filter="url(#parilti)"/><rect x="360" y="190" width="280" height="190" rx="20" fill="#60A5FA" fill-opacity="0.08"/><text x="500.0" y="242" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >🌱</text><text x="500.0" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" >2  Zayıf ağaç eğit</text><text x="500.0" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >hₜ(x): sığ regresyon</text><text x="500.0" y="329" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >ağacı (varsayılan derinlik 3)</text><rect x="360" y="190" width="280" height="190" rx="20" fill="none" stroke="#60A5FA" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="0.7s" repeatCount="indefinite"/></rect><path d="M644,285 H716" fill="none" stroke="#60A5FA" stroke-width="3" stroke-opacity="0.35" marker-end="url(#ok)"/><path d="M644,285 H716" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="10 80" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="234;0" dur="2.0s" repeatCount="indefinite"/></path><circle r="5" fill="#60A5FA" filter="url(#parilti)"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M644,285 H716"/></circle><rect x="660" y="190" width="280" height="190" rx="20" fill="#0F1535" stroke="#2DD4BF" stroke-width="2.2" filter="url(#parilti)"/><rect x="660" y="190" width="280" height="190" rx="20" fill="#2DD4BF" fill-opacity="0.08"/><text x="800.0" y="242" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >📏</text><text x="800.0" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" >3  Hata ölç</text><text x="800.0" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >eᵢ = |yᵢ − hₜ(xᵢ)| / D</text><text x="800.0" y="329" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >Lᵢ = eᵢ  |  eᵢ²  |  1 − e^(−eᵢ)</text><rect x="660" y="190" width="280" height="190" rx="20" fill="none" stroke="#2DD4BF" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="1.4s" repeatCount="indefinite"/></rect><path d="M944,285 H1016" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-opacity="0.35" marker-end="url(#ok)"/><path d="M944,285 H1016" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="10 80" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="234;0" dur="2.0s" repeatCount="indefinite"/></path><circle r="5" fill="#2DD4BF" filter="url(#parilti)"><animateMotion dur="1.8s" begin="0.8s" repeatCount="indefinite" path="M944,285 H1016"/></circle><rect x="960" y="190" width="280" height="190" rx="20" fill="#0F1535" stroke="#F6B84B" stroke-width="2.2" filter="url(#parilti)"/><rect x="960" y="190" width="280" height="190" rx="20" fill="#F6B84B" fill-opacity="0.08"/><text x="1100.0" y="242" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >⚖️</text><text x="1100.0" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" >4  Güven katsayısı</text><text x="1100.0" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >L̄ = Σ wᵢ Lᵢ   ·   β = L̄/(1−L̄)</text><text x="1100.0" y="329" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >L̄ ≥ 0,5 ise dur</text><rect x="960" y="190" width="280" height="190" rx="20" fill="none" stroke="#F6B84B" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="2.0999999999999996s" repeatCount="indefinite"/></rect><path d="M1244,285 H1316" fill="none" stroke="#F6B84B" stroke-width="3" stroke-opacity="0.35" marker-end="url(#ok)"/><path d="M1244,285 H1316" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.75" stroke-dasharray="10 80" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="234;0" dur="2.0s" repeatCount="indefinite"/></path><circle r="5" fill="#F6B84B" filter="url(#parilti)"><animateMotion dur="1.8s" begin="1.2000000000000002s" repeatCount="indefinite" path="M1244,285 H1316"/></circle><rect x="1260" y="190" width="280" height="190" rx="20" fill="#0F1535" stroke="#F472B6" stroke-width="2.2" filter="url(#parilti)"/><rect x="1260" y="190" width="280" height="190" rx="20" fill="#F472B6" fill-opacity="0.08"/><text x="1400.0" y="242" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >🔁</text><text x="1400.0" y="282" text-anchor="middle" font-size="20" font-weight="800" fill="#F8FAFC" >5  Ağırlık güncelle</text><text x="1400.0" y="308" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >wᵢ ← wᵢ · β^{(1−Lᵢ)·η}</text><text x="1400.0" y="329" text-anchor="middle" font-size="14" font-weight="500" fill="#CBD5E1" >zor örnek → görece ağırlık ↑</text><rect x="1260" y="190" width="280" height="190" rx="20" fill="none" stroke="#F472B6" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="2.8s" repeatCount="indefinite"/></rect><path d="M1400,392 V450 H200 V396" fill="none" stroke="#F6B84B" stroke-width="3" stroke-opacity="0.4" marker-end="url(#ok)"/><path d="M1400,392 V450 H200 V396" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.7" stroke-dasharray="10 80" stroke-linecap="round"><animate attributeName="stroke-dashoffset" values="234;0" dur="3s" repeatCount="indefinite"/></path><circle r="6" fill="#F6B84B" filter="url(#parilti)"><animateMotion dur="5s" repeatCount="indefinite" path="M1400,392 V450 H200 V396"/></circle><text x="800" y="438" text-anchor="middle" font-size="16" font-weight="700" fill="#F6B84B" >T tur tekrar</text><rect x="470" y="495" width="660" height="150" rx="20" fill="#0F1535" stroke="#4ADE80" stroke-width="2.2" filter="url(#parilti)"/><rect x="470" y="495" width="660" height="150" rx="20" fill="#4ADE80" fill-opacity="0.08"/><text x="800.0" y="547" text-anchor="middle" font-size="34" font-weight="500" fill="#E2E8F0" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif" >🏁</text><text x="800.0" y="587" text-anchor="middle" font-size="22" font-weight="800" fill="#F8FAFC" >Son tahmin: ağırlıklı medyan</text><text x="800.0" y="613" text-anchor="middle" font-size="16" font-weight="500" fill="#CBD5E1" >ŷ(x) = ağırlıklı medyan{ hₜ(x) } ,  ağırlık = ln(1/βₜ) · η</text><rect x="470" y="495" width="660" height="150" rx="20" fill="none" stroke="#4ADE80" stroke-opacity="0"><animate attributeName="stroke-opacity" values="0;0.9;0" dur="3.6s" begin="0.0s" repeatCount="indefinite"/></rect>
