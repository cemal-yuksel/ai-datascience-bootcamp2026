<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B1A"/><stop offset="0.6" stop-color="#0A1F3D"/><stop offset="1" stop-color="#0B3A52"/></linearGradient>
<linearGradient id="altin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="dalga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5C6" stop-opacity="0.55"/><stop offset="1" stop-color="#0B3A52" stop-opacity="0.9"/></linearGradient>
<linearGradient id="dalga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#0A1F3D" stop-opacity="0.9"/></linearGradient>
<radialGradient id="ay" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FEF9C3" stop-opacity="0.95"/><stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="500" rx="26" fill="url(#bg)"/>
<text x="800.0" y="62" text-anchor="middle" font-size="38" class="b" fill="url(#altin)">Boosting: beş adımlık döngü</text><rect x="60" y="200" width="250" height="110" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="185.0" y="251.0" text-anchor="middle" font-size="22" class="b t">1  İlk tahmin</text><text x="185.0" y="279.0" text-anchor="middle" font-size="16" class="k">herkese ortalama</text><path id="m1" d="M312 255 L358 255" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m1"/></animateMotion></circle><rect x="360" y="200" width="250" height="110" rx="16" fill="#0F172A" stroke="#F87171" stroke-width="2.4"/><text x="485.0" y="251.0" text-anchor="middle" font-size="22" class="b t">2  Hata (artık)</text><text x="485.0" y="279.0" text-anchor="middle" font-size="16" class="k">gerçek − tahmin</text><path id="m2" d="M612 255 L658 255" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m2"/></animateMotion></circle><rect x="660" y="200" width="250" height="110" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="785.0" y="251.0" text-anchor="middle" font-size="22" class="b t">3  Yeni çırak</text><text x="785.0" y="279.0" text-anchor="middle" font-size="16" class="k">hataları öğrenir</text><path id="m3" d="M912 255 L958 255" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m3"/></animateMotion></circle><rect x="960" y="200" width="250" height="110" rx="16" fill="#0F172A" stroke="#FBBF24" stroke-width="2.4"/><text x="1085.0" y="251.0" text-anchor="middle" font-size="22" class="b t">4  Güncelle</text><text x="1085.0" y="279.0" text-anchor="middle" font-size="16" class="k">küçük adımla ekle</text><path id="m4" d="M1212 255 L1258 255" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m4"/></animateMotion></circle><rect x="1260" y="200" width="250" height="110" rx="16" fill="#0F172A" stroke="#A78BFA" stroke-width="2.4"/><text x="1385.0" y="251.0" text-anchor="middle" font-size="22" class="b t">5  Tekrar</text><text x="1385.0" y="279.0" text-anchor="middle" font-size="16" class="k">yüzlerce tur</text><path d="M1485 322 Q1485 400 800 400 Q185 400 185 322" fill="none" stroke="#A78BFA" stroke-width="3" class="akis" marker-end="url(#ok)"/><text x="800" y="440" text-anchor="middle" font-size="22" class="k">Her tur, ekibin hatasını biraz daha azaltır</text>
</svg>