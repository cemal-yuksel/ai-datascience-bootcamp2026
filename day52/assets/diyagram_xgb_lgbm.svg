t ile)</text><rect x="900" y="400" width="480" height="64" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="1140.0" y="440.0" text-anchor="middle" font-size="20" class="b t">hızlı (kova ile)</text><text x="100" y="522" font-size="24" class="b t">Risk</text><rect x="300" y="480" width="480" height="64" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="540.0" y="520.0" text-anchor="middle" font-size="20" class="b t">dengeli ağaç</text><rect x="900" y="480" width="480" height="64" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="1140.0" y="520.0" text-anchor="middle" font-size="20" class="b t">küçük veride ezber riski</text>
