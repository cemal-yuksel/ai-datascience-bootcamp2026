<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B1A"/><stop offset="0.6" stop-color="#0A1F3D"/><stop offset="1" stop-color="#0B3A52"/></linearGradient>
<linearGradient id="altin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="dalga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5C6" stop-opacity="0.55"/><stop offset="1" stop-color="#0B3A52" stop-opacity="0.9"/></linearGradient>
<linearGradient id="dalga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#0A1F3D" stop-opacity="0.9"/></linearGradient>
<radialGradient id="ay" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FEF9C3" stop-opacity="0.95"/><stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="400" rx="26" fill="url(#bg)"/>
<text x="800.0" y="62" text-anchor="middle" font-size="38" class="b" fill="url(#altin)">Boosting ailesi</text><rect x="40" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#94A3B8" stroke-width="2.4"/><text x="155.0" y="241.0" text-anchor="middle" font-size="20" class="b t">Karar ağacı</text><text x="155.0" y="269.0" text-anchor="middle" font-size="16" class="k">tek usta</text><path id="m16" d="M272 245 L293 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="295" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="410.0" y="241.0" text-anchor="middle" font-size="20" class="b t">Rastgele orman</text><text x="410.0" y="269.0" text-anchor="middle" font-size="16" class="k">bağımsız ormanlar</text><path id="m17" d="M527 245 L548 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="550" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#FBBF24" stroke-width="2.4"/><text x="665.0" y="241.0" text-anchor="middle" font-size="20" class="b t">Gradient Boosting</text><text x="665.0" y="269.0" text-anchor="middle" font-size="16" class="k">hatadan öğren</text><path id="m18" d="M782 245 L803 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="805" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="920.0" y="241.0" text-anchor="middle" font-size="20" class="b t">XGBoost</text><text x="920.0" y="269.0" text-anchor="middle" font-size="16" class="k">düzenleme + sistem</text><path id="m19" d="M1037 245 L1058 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="1060" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#A78BFA" stroke-width="2.4"/><text x="1175.0" y="241.0" text-anchor="middle" font-size="20" class="b t">LightGBM</text><text x="1175.0" y="269.0" text-anchor="middle" font-size="16" class="k">kova + yaprak yaprak</text><path id="m20" d="M1292 245 L1313 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="1315" y="190" width="230" height="110" rx="16" fill="#0F172A" stroke="#F472B6" stroke-width="2.4"/><text x="1430.0" y="241.0" text-anchor="middle" font-size="20" class="b t">CatBoost</text><text x="1430.0" y="269.0" text-anchor="middle" font-size="16" class="k">kategoriyi akıllı işler</text>
</svg>