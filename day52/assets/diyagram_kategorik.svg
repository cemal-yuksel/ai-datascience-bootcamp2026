<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 440" width="1600" height="440" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B1A"/><stop offset="0.6" stop-color="#0A1F3D"/><stop offset="1" stop-color="#0B3A52"/></linearGradient>
<linearGradient id="altin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="dalga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5C6" stop-opacity="0.55"/><stop offset="1" stop-color="#0B3A52" stop-opacity="0.9"/></linearGradient>
<linearGradient id="dalga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#0A1F3D" stop-opacity="0.9"/></linearGradient>
<radialGradient id="ay" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FEF9C3" stop-opacity="0.95"/><stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="440" rx="26" fill="url(#bg)"/>
<text x="800.0" y="62" text-anchor="middle" font-size="38" class="b" fill="url(#altin)">Kategorik sütunlar: etiketi olduğu gibi anlamak</text><rect x="80" y="140" width="300" height="100" rx="16" fill="#0F172A" stroke="C · Q · S" stroke-width="2.4"/><text x="230.0" y="186.0" text-anchor="middle" font-size="22" class="b t">Biniş limanı</text><text x="230.0" y="214.0" text-anchor="middle" font-size="16" class="k">#FBBF24</text><rect x="600" y="110" width="360" height="70" rx="16" fill="#0F172A" stroke="#F87171" stroke-width="2.4"/><text x="780.0" y="153.0" text-anchor="middle" font-size="19" class="b t">Etiket kodlama: C=0, Q=1, S=2</text><rect x="600" y="210" width="360" height="70" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="780.0" y="253.0" text-anchor="middle" font-size="19" class="b t">Tek-sıcak: 3 ayrı sütun</text><rect x="600" y="310" width="360" height="70" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="780.0" y="353.0" text-anchor="middle" font-size="19" class="b t">LightGBM: kategori olarak ver</text><path id="m6" d="M382 190 L598 145" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m6"/></animateMotion></circle><path id="m7" d="M382 190 L598 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m7"/></animateMotion></circle><path id="m8" d="M382 190 L598 345" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><circle r="6" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#m8"/></animateMotion></circle><rect x="1160" y="110" width="360" height="70" rx="16" fill="#0F172A" stroke="#F87171" stroke-width="2.4"/><text x="1340.0" y="153.0" text-anchor="middle" font-size="17" class="b t">Sahte sıra: Q, C ile S arasında?</text><rect x="1160" y="210" width="360" height="70" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="1340.0" y="253.0" text-anchor="middle" font-size="17" class="b t">Sütun sayısı artar, seyreklik büyür</text><rect x="1160" y="310" width="360" height="70" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="1340.0" y="353.0" text-anchor="middle" font-size="17" class="b t">Kümeler halinde bölünür: {C,Q} | {S}</text><path id="m9" d="M962 145 L1158 145" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><path id="m10" d="M962 245 L1158 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><path id="m11" d="M962 345 L1158 345" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/>
</svg>