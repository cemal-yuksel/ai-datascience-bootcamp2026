<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 640" width="1600" height="640" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B1A"/><stop offset="0.6" stop-color="#0A1F3D"/><stop offset="1" stop-color="#0B3A52"/></linearGradient>
<linearGradient id="altin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="dalga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5C6" stop-opacity="0.55"/><stop offset="1" stop-color="#0B3A52" stop-opacity="0.9"/></linearGradient>
<linearGradient id="dalga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#0A1F3D" stop-opacity="0.9"/></linearGradient>
<radialGradient id="ay" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FEF9C3" stop-opacity="0.95"/><stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="640" rx="26" fill="url(#bg)"/>
<text x="800.0" y="62" text-anchor="middle" font-size="38" class="b" fill="url(#altin)">Katman katman mı, yaprak yaprak mı?</text><text x="400" y="130" text-anchor="middle" font-size="26" class="b" fill="#38BDF8">XGBoost: katman katman (level-wise)</text><text x="1200" y="130" text-anchor="middle" font-size="26" class="b" fill="#34D399">LightGBM: yaprak yaprak (leaf-wise)</text><line x1="400" y1="180" x2="280" y2="290" stroke="#64748B" stroke-width="2.5"/><line x1="400" y1="180" x2="520" y2="290" stroke="#64748B" stroke-width="2.5"/><line x1="280" y1="290" x2="220" y2="400" stroke="#64748B" stroke-width="2.5"/><line x1="280" y1="290" x2="340" y2="400" stroke="#64748B" stroke-width="2.5"/><line x1="520" y1="290" x2="460" y2="400" stroke="#64748B" stroke-width="2.5"/><line x1="520" y1="290" x2="580" y2="400" stroke="#64748B" stroke-width="2.5"/><circle cx="400" cy="180" r="17" fill="#38BDF8" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0s"/><circle cx="280" cy="290" r="17" fill="#38BDF8" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.3s"/><circle cx="520" cy="290" r="17" fill="#38BDF8" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.3s"/><circle cx="220" cy="400" r="17" fill="#0EA5C6" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.6s"/><circle cx="340" cy="400" r="17" fill="#0EA5C6" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.6s"/><circle cx="460" cy="400" r="17" fill="#0EA5C6" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.6s"/><circle cx="580" cy="400" r="17" fill="#0EA5C6" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.6s"/><line x1="1200" y1="180" x2="1080" y2="290" stroke="#64748B" stroke-width="2.5"/><line x1="1200" y1="180" x2="1320" y2="290" stroke="#64748B" stroke-width="2.5"/><line x1="1320" y1="290" x2="1260" y2="400" stroke="#64748B" stroke-width="2.5"/><line x1="1320" y1="290" x2="1380" y2="400" stroke="#64748B" stroke-width="2.5"/><line x1="1380" y1="400" x2="1320" y2="510" stroke="#64748B" stroke-width="2.5"/><line x1="1380" y1="400" x2="1440" y2="510" stroke="#64748B" stroke-width="2.5"/><circle cx="1200" cy="180" r="17" fill="#34D399" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0s"/><circle cx="1080" cy="290" r="17" fill="#64748B" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0s"/><circle cx="1320" cy="290" r="17" fill="#34D399" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.3s"/><circle cx="1260" cy="400" r="17" fill="#64748B" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0s"/><circle cx="1380" cy="400" r="17" fill="#34D399" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.6s"/><circle cx="1320" cy="510" r="17" fill="#FBBF24" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:0.9s"/><circle cx="1440" cy="510" r="17" fill="#FBBF24" stroke="#E2E8F0" stroke-width="2" class="nefes" style="animation-delay:1.2s"/><text x="400" y="480" text-anchor="middle" font-size="20" class="k">Her katman eksiksiz dolar: düzenli, dengeli</text><text x="1200" y="590" text-anchor="middle" font-size="20" class="k">Yalnızca en çok kazanç getiren yaprak büyür: asimetrik, hızlı</text><line x1="800" y1="110" x2="800" y2="610" stroke="#334155" stroke-dasharray="6 8"/>
</svg>