<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 450" width="1600" height="450" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#050B1A"/><stop offset="0.6" stop-color="#0A1F3D"/><stop offset="1" stop-color="#0B3A52"/></linearGradient>
<linearGradient id="altin" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
<linearGradient id="dalga1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0EA5C6" stop-opacity="0.55"/><stop offset="1" stop-color="#0B3A52" stop-opacity="0.9"/></linearGradient>
<linearGradient id="dalga2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.35"/><stop offset="1" stop-color="#0A1F3D" stop-opacity="0.9"/></linearGradient>
<radialGradient id="ay" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FEF9C3" stop-opacity="0.95"/><stop offset="1" stop-color="#FEF9C3" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes kay{0%{transform:translateX(0)}100%{transform:translateX(-400px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="450" rx="26" fill="url(#bg)"/>
<text x="800.0" y="62" text-anchor="middle" font-size="38" class="b" fill="url(#altin)">Proje akışı: uçtan uca</text><rect x="40" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="2.4"/><text x="115.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Veri</text><path id="m21" d="M192 245 L210 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="212" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#F87171" stroke-width="2.4"/><text x="287.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Kalite</text><path id="m22" d="M364 245 L382 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="384" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#FBBF24" stroke-width="2.4"/><text x="459.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Keşif</text><path id="m23" d="M536 245 L554 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="556" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#34D399" stroke-width="2.4"/><text x="631.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Bölme</text><path id="m24" d="M708 245 L726 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="728" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#A78BFA" stroke-width="2.4"/><text x="803.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Pipeline</text><path id="m25" d="M880 245 L898 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="900" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#FB923C" stroke-width="2.4"/><text x="975.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Yarış</text><path id="m26" d="M1052 245 L1070 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="1072" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#2DD4BF" stroke-width="2.4"/><text x="1147.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Ayar</text><path id="m27" d="M1224 245 L1242 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="1244" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#F472B6" stroke-width="2.4"/><text x="1319.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Final</text><path id="m28" d="M1396 245 L1414 245" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#ok)" class="akis"/><rect x="1416" y="200" width="150" height="90" rx="16" fill="#0F172A" stroke="#FACC15" stroke-width="2.4"/><text x="1491.0" y="253.0" text-anchor="middle" font-size="21" class="b t">Karar</text><circle r="9" fill="#FBBF24" filter="url(#parilti)"><animateMotion dur="7s" repeatCount="indefinite" path="M115 330 L1475 330"/></circle><line x1="115" y1="330" x2="1475" y2="330" stroke="#334155" stroke-width="2"/><text x="800" y="400" text-anchor="middle" font-size="22" class="k">Hiçbir adım test setine bakmadan seçilir</text>
</svg>