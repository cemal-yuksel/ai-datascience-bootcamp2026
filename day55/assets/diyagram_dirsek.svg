<text x="60" y="60" font-size="32" class="t b" text-anchor="start" >Dirsek yöntemi: grup ekledikçe kazanç azalır</text><line x1="200" y1="500" x2="1350" y2="500" stroke="#64748B" stroke-width="2"/><line x1="200" y1="500" x2="200" y2="70" stroke="#64748B" stroke-width="2"/><polyline points="220,90 370,270 520,370 670,392 820,408 970,420 1120,428 1270,434" fill="none" stroke="#FBBF24" stroke-width="5" stroke-dasharray="1600" stroke-dashoffset="1600"><animate attributeName="stroke-dashoffset" values="1600;0;0" keyTimes="0;.6;1" dur="5s" repeatCount="indefinite"/></polyline><circle cx="220" cy="90" r="8" fill="#FBBF24"/><text x="220" y="530" font-size="18" class="k" text-anchor="middle" >1</text><circle cx="370" cy="270" r="8" fill="#FBBF24"/><text x="370" y="530" font-size="18" class="k" text-anchor="middle" >2</text><circle cx="520" cy="370" r="8" fill="#FBBF24"/><text x="520" y="530" font-size="18" class="k" text-anchor="middle" >3</text><circle cx="670" cy="392" r="8" fill="#FBBF24"/><text x="670" y="530" font-size="18" class="k" text-anchor="middle" >4</text><circle cx="820" cy="408" r="8" fill="#FBBF24"/><text x="820" y="530" font-size="18" class="k" text-anchor="middle" >5</text><circle cx="970" cy="420" r="8" fill="#FBBF24"/><text x="970" y="530" font-size="18" class="k" text-anchor="middle" >6</text><circle cx="1120" cy="428" r="8" fill="#FBBF24"/><text x="1120" y="530" font-size="18" class="k" text-anchor="middle" >7</text><circle cx="1270" cy="434" r="8" fill="#FBBF24"/><text x="1270" y="530" font-size="18" class="k" text-anchor="middle" >8</text><circle cx="520" cy="370" r="26" fill="none" stroke="#F472B6" stroke-width="4" class="nefes"/><text x="560" y="340" font-size="24" class="t b" text-anchor="start" fill='#F472B6'>dirsek → k = 3</text><text x="150" y="290" font-size="20" class="k" text-anchor="middle" transform="rotate(-90 150 290)">WCSS</text><text x="775" y="565" font-size="20" class="k" text-anchor="middle" >küme sayısı (k)</text><rect x="1380" y="140" width="190" height="260" rx="16" fill="#0B1026" stroke="#34D399"/><text x="1475" y="190" font-size="20" class="t b" text-anchor="middle" >WCSS =</text><text x="1475" y="225" font-size="16" class="k" text-anchor="middle" >her noktanın</text><text x="1475" y="250" font-size="16" class="k" text-anchor="middle" >merkezine</text><text x="1475" y="275" font-size="16" class="k" text-anchor="middle" >uzaklığının</text><text x="1475" y="300" font-size="16" class="k" text-anchor="middle" >karesi, toplamı</text><text x="1475" y="350" font-size="18" class="t b" text-anchor="middle" >küçük = sıkı</text>
