<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 600" width="1600" height="600" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A23"/><stop offset="0.5" stop-color="#1B1446"/><stop offset="1" stop-color="#0F3B4A"/></linearGradient>
<linearGradient id="parlak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<radialGradient id="hale" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FDE68A" stop-opacity="0.6"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes don{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes kay{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
.don{transform-box:fill-box;transform-origin:center;animation:don 18s linear infinite}
.kay{animation:kay 4s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="600" rx="26" fill="url(#bg)"/>
