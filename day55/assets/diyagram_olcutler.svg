<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" width="1600" height="500" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0A23"/><stop offset="0.5" stop-color="#1B1446"/><stop offset="1" stop-color="#0F3B4A"/></linearGradient>
<linearGradient id="parlak" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<radialGradient id="hale" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#FDE68A" stop-opacity="0.6"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/></radialGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<marker id="okY" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#34D399"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes don{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes kay{0%,100%{transform:translateX(0)}50%{transform:translateX(14px)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
.don{transform-box:fill-box;transform-origin:center;animation:don 18s linear infinite}
.kay{animation:kay 4s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="500" rx="26" fill="url(#bg)"/>
<circle cx="377" cy="247" r="2.0" fill="#fff" class="yan" style="animation-delay:1.3s"/>
<circle cx="384" cy="278" r="1.3" fill="#fff" class="yan" style="animation-delay:0.7s"/>
<circle cx="1167" cy="458" r="0.8" fill="#fff" class="yan" style="animation-delay:2.8s"/>
<circle cx="1160" cy="261" r="0.7" fill="#fff" class="yan" style="animation-delay:2.8s"/>
<circle cx="1067" cy="135" r="1.1" fill="#fff" class="yan" style="animation-delay:0.4s"/>
<circle cx="1281" cy="421" r="0.7" fill="#fff" class="yan" style="animation-delay:2.9s"/>
<circle cx="982" cy="248" r="1.4" fill="#fff" class="yan" style="animation-delay:3.0s"/>
<circle cx="1556" cy="406" r="1.0" fill="#fff" class="yan" style="animation-delay:0.0s"/>
<circle cx="746" cy="3" r="0.8" fill="#fff" class="yan" style="animation-delay:2.0s"/>
<circle cx="1258" cy="332" r="1.2" fill="#fff" class="yan" style="animation-delay:1.3s"/>
<circle cx="261" cy="239" r="1.4" fill="#fff" class="yan" style="animation-delay:0.1s"/>
<circle cx="1174" cy="232" r="1.0" fill="#fff" class="yan" style="animation-delay:2.2s"/>
<circle cx="122" cy="181" r="1.6" fill="#fff" class="yan" style="animation-delay:0.3s"/>
<circle cx="162" cy="417" r="1.7" fill="#fff" class="yan" style="animation-delay:0.6s"/>
<circle cx="80" cy="258" r="1.2" fill="#fff" class="yan" style="animation-delay:2.8s"/>
<text x="60" y="60" font-size="32" class="t b" text-anchor="start" >Etiket yokken kaliteyi ölçen üç ölçüt</text><g class="yuz" style="animation-delay:0.0s"><rect x="70" y="110" width="460" height="300" rx="22" fill="#0B1026" stroke="#FBBF24" stroke-width="3"/><text x="300" y="170" font-size="30" class="t b" text-anchor="middle" >Silüet</text><text x="300" y="210" font-size="20" class="t" text-anchor="middle" fill='#FBBF24'>−1 … +1 · büyük iyi</text><text x="300" y="270" font-size="19" class="k" text-anchor="middle" >her nokta için</text><text x="300" y="300" font-size="19" class="k" text-anchor="middle" >sıkılık + ayrılık</text><text x="300" y="330" font-size="19" class="k" text-anchor="middle" >en yaygın ölçüt</text></g><g class="yuz" style="animation-delay:0.5s"><rect x="575" y="110" width="460" height="300" rx="22" fill="#0B1026" stroke="#38BDF8" stroke-width="3"/><text x="805" y="170" font-size="30" class="t b" text-anchor="middle" >Davies-Bouldin</text><text x="805" y="210" font-size="20" class="t" text-anchor="middle" fill='#38BDF8'>0 … ∞ · küçük iyi</text><text x="805" y="270" font-size="19" class="k" text-anchor="middle" >her grubun en çok</text><text x="805" y="300" font-size="19" class="k" text-anchor="middle" >karıştığı komşu</text><text x="805" y="330" font-size="19" class="k" text-anchor="middle" >ortalaması</text></g><g class="yuz" style="animation-delay:1.0s"><rect x="1080" y="110" width="460" height="300" rx="22" fill="#0B1026" stroke="#F472B6" stroke-width="3"/><text x="1310" y="170" font-size="30" class="t b" text-anchor="middle" >Calinski-Harabasz</text><text x="1310" y="210" font-size="20" class="t" text-anchor="middle" fill='#F472B6'>0 … ∞ · büyük iyi</text><text x="1310" y="270" font-size="19" class="k" text-anchor="middle" >gruplar arası yayılım /</text><text x="1310" y="300" font-size="19" class="k" text-anchor="middle" >grup içi yayılım</text><text x="1310" y="330" font-size="19" class="k" text-anchor="middle" >(varyans oranı)</text></g><text x="800" y="465" font-size="22" class="k" text-anchor="middle" >Tek ölçüte güvenme: üçü birlikte + kararlılık + iş anlamı</text>
</svg>