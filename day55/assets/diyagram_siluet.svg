<text x="60" y="60" font-size="32" class="t b" text-anchor="start" >Silüet: kendi grubuma ne kadar ait, komşuya ne kadar uzak?</text><circle cx="465" cy="375" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="465" y2="375" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="334" cy="300" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="334" y2="300" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="517" cy="285" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="517" y2="285" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="545" cy="307" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="545" y2="307" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="436" cy="341" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="436" y2="341" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="517" cy="357" r="7" fill="#FBBF24"/><line x1="520" y1="330" x2="517" y2="357" stroke="#FBBF24" stroke-width="1.5" opacity=".7"/><circle cx="546" cy="358" r="7" fill="#FBBF24"/><circle cx="513" cy="302" r="7" fill="#FBBF24"/><circle cx="492" cy="301" r="7" fill="#FBBF24"/><circle cx="412" cy="301" r="7" fill="#FBBF24"/><circle cx="457" cy="333" r="7" fill="#FBBF24"/><circle cx="501" cy="362" r="7" fill="#FBBF24"/><circle cx="488" cy="251" r="7" fill="#FBBF24"/><circle cx="500" cy="329" r="7" fill="#FBBF24"/><circle cx="907" cy="352" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="907" y2="352" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="890" cy="296" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="890" y2="296" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="812" cy="221" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="812" y2="221" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="877" cy="328" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="877" y2="328" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="908" cy="245" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="908" y2="245" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="801" cy="188" r="7" fill="#38BDF8"/><line x1="520" y1="330" x2="801" y2="188" stroke="#38BDF8" stroke-width="1.5" opacity=".5" class="akis"/><circle cx="932" cy="294" r="7" fill="#38BDF8"/><circle cx="934" cy="323" r="7" fill="#38BDF8"/><circle cx="786" cy="281" r="7" fill="#38BDF8"/><circle cx="981" cy="335" r="7" fill="#38BDF8"/><circle cx="955" cy="273" r="7" fill="#38BDF8"/><circle cx="1007" cy="329" r="7" fill="#38BDF8"/><circle cx="929" cy="311" r="7" fill="#38BDF8"/><circle cx="1008" cy="186" r="7" fill="#38BDF8"/><circle cx="520" cy="330" r="13" fill="#F472B6" stroke="#fff" stroke-width="3" class="nefes"/><text x="510" y="375" font-size="26" class="t b" text-anchor="start" >i</text><text x="420" y="470" font-size="20" class="t" text-anchor="middle" fill="#FBBF24">a(i): kendi grubuna ortalama uzaklık</text><text x="920" y="440" font-size="20" class="t" text-anchor="middle" fill="#38BDF8">b(i): en yakın komşu gruba ortalama uzaklık</text><rect x="1150" y="130" width="410" height="330" rx="18" fill="#0B1026" stroke="#34D399" stroke-width="2.5"/><text x="1355" y="185" font-size="22" class="t b" text-anchor="middle" >s(i) = (b − a) / max(a, b)</text><text x="1190" y="250" font-size="24" class="t b" text-anchor="start" fill='#34D399'>≈ +1</text><text x="1290" y="250" font-size="18" class="k" text-anchor="start" >doğru yerde, rahat</text><text x="1190" y="315" font-size="24" class="t b" text-anchor="start" fill='#FBBF24'>≈ 0</text><text x="1290" y="315" font-size="18" class="k" text-anchor="start" >iki grubun sınırında</text><text x="1190" y="380" font-size="24" class="t b" text-anchor="start" fill='#F472B6'>&lt; 0</text><text x="1290" y="380" font-size="18" class="k" text-anchor="start" >yanlış gruba düşmüş olabilir</text>
