="animation-delay:0.9s"/><circle cx="510" cy="78" r="0.9" fill="#fff" class="yan" style="animation-delay:0.4s"/><circle cx="1100" cy="413" r="1.0" fill="#fff" class="yan" style="animation-delay:0.1s"/><circle cx="1571" cy="224" r="1.3" fill="#fff" class="yan" style="animation-delay:0.7s"/><circle cx="949" cy="343" r="1.4" fill="#fff" class="yan" style="animation-delay:1.3s"/><circle cx="96" cy="380" r="0.8" fill="#fff" class="yan" style="animation-delay:1.5s"/><circle cx="1336" cy="59" r="1.8" fill="#fff" class="yan" style="animation-delay:2.8s"/><circle cx="1007" cy="328" r="0.9" fill="#fff" class="yan" style="animation-delay:1.3s"/><text x="60" y="60" font-size="32" class="t b" text-anchor="start" >PCA'nın beş adımı</text><rect x="50" y="140" width="260" height="170" rx="18" fill="#0B1026" fill-opacity=".85" stroke="#38BDF8" stroke-width="2.4"/><text x="180.0" y="219.0" font-size="21" font-weight="700" text-anchor="middle" class="t">1 · Standartlaştır</text><text x="180.0" y="247.0" font-size="15" text-anchor="middle" class="k">ortalama 0, yayılım 1</text><line x1="315" y1="225" x2="355" y2="225" stroke="#CBD5E1" stroke-width="3" class="akis" marker-end="url(#ok)"/><rect x="360" y="140" width="260" height="170" rx="18" fill="#0B1026" fill-opacity=".85" stroke="#34D399" stroke-width="2.4"/><text x="490.0" y="219.0" font-size="21" font-weight="700" text-anchor="middle" class="t">2 · Kovaryans</text><text x="490.0" y="247.0" font-size="15" text-anchor="middle" class="k">ölçüler birlikte nasıl değişir?</text><line x1="625" y1="225" x2="665" y2="225" stroke="#CBD5E1" stroke-width="3" class="akis" marker-end="url(#ok)"/><rect x="670" y="140" width="260" height="170" rx="18" fill="#0B1026" fill-opacity=".85" stroke="#FBBF24" stroke-width="2.4"/><text x="800.0" y="219.0" font-size="21" font-weight="700" text-anchor="middle" class="t">3 · Özvektör</text><text x="800.0" y="247.0" font-size="15" text-anchor="middle" class="k">yayılımın yönleri</text><line x1="935" y1="225" x