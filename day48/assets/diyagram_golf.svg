<text x="150.0" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#CBD5E1">başlangıç</text>
<text x="150.0" y="438" text-anchor="middle" font-size="18" font-weight="800" fill="#F6B84B">kalan: %100</text>
<text x="775.0" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#CBD5E1">vuruş 1</text>
<text x="775.0" y="438" text-anchor="middle" font-size="18" font-weight="800" fill="#F472B6">kalan: %50</text>
<text x="1087.5" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#CBD5E1">vuruş 2</text>
<text x="1087.5" y="438" text-anchor="middle" font-size="18" font-weight="800" fill="#38BDF8">kalan: %25</text>
<text x="1243.75" y="410" text-anchor="middle" font-size="17" font-weight="700" fill="#CBD5E1">vuruş 3</text>
<text x="1243.75" y="438" text-anchor="middle" font-size="18" font-weight="800" fill="#34D399">kalan: %12</text>
<text x="800" y="500" text-anchor="middle" font-size="20" font-weight="600" fill="#E2E8F0">Her vuruş, kalan mesafenin bir kısmını kapatır. Gradient Boosting&#x27;de her ağaç da kalan hatanın bir kısmını kapatır.</text>
<text x="800" y="120" text-anchor="middle" font-size="22" font-weight="700" fill="#F8FAFC">⛳ Golf benzetmesi: top deliğe tek vuruşta girmez; her vuruş yalnızca kalan mesafeye bakar</text>
