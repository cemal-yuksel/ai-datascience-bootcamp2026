<text x="800" y="400" text-anchor="middle" font-size="22" font-weight="600" fill="#E2E8F0">Her ağaç küçüktür (zayıf), ama toplam büyük bir ekip gibi çalışır.</text>
<text x="800" y="438" text-anchor="middle" font-size="18" font-weight="500" fill="#94A3B8" font-style="italic">Ağaçlar birbirinden bağımsız değil, sırayla ve öncekinin artığına göre eğitilir.</text>
