<g><rect x="90" y="110" width="600" height="300" rx="20" fill="#0B1026" opacity="0.9"/><rect x="90" y="110" width="600" height="300" rx="20" fill="#F472B6" fill-opacity="0.10" stroke="#F472B6" stroke-width="2.2" filter="url(#parilti)"/>
<text x="390.0" y="156" text-anchor="middle" font-size="34" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🎡</text>
<text x="390.0" y="194" text-anchor="middle" font-size="30" font-weight="800" fill="#F8FAFC">AdaBoost</text>
<text x="390.0" y="220" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Zor satırların ağırlığını büyütür</text>
<text x="390.0" y="241" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Her modelin oy hakkı (α) vardır</text>
<text x="390.0" y="262" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Karar: ağırlıklı oylama / ağırlıklı medyan</text>
<text x="390.0" y="283" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Zayıf öğrenici: genelde kütük (derinlik 1)</text>
</g>
<g><rect x="910" y="110" width="600" height="300" rx="20" fill="#0B1026" opacity="0.9"/><rect x="910" y="110" width="600" height="300" rx="20" fill="#F6B84B" fill-opacity="0.10" stroke="#F6B84B" stroke-width="2.2" filter="url(#parilti)"/>
<text x="1210.0" y="156" text-anchor="middle" font-size="34" font-family="'Segoe UI Emoji', 'Apple Color Emoji', 'Noto Color Emoji', sans-serif">🏔️</text>
<text x="1210.0" y="194" text-anchor="middle" font-size="30" font-weight="800" fill="#F8FAFC">Gradient Boosting</text>
<text x="1210.0" y="220" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Hedef olarak kalan hatayı (artığı) öğrenir</text>
<text x="1210.0" y="241" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Her ağaç aynı ağırlıkla, ama η ile küçültülür</text>
<text x="1210.0" y="262" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Karar: tahminlerin toplamı</text>
<text x="1210.0" y="283" text-anchor="middle" font-size="15.5" font-weight="500" fill="#CBD5E1">Ağaçlar biraz daha derin (3–8 yaprak)</text>
</g>
