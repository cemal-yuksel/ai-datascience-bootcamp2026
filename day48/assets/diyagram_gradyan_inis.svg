<text x="800" y="528" text-anchor="middle" font-size="20" font-weight="600" fill="#E2E8F0">Dağın yamacında gözünüz kapalı iniyorsunuz: her adımda yalnızca &#x27;hangi yön daha aşağı?&#x27; diye bakarsınız.</text>
<text x="800" y="562" text-anchor="middle" font-size="18" font-weight="500" fill="#94A3B8" font-style="italic">Her ağaç = bir adım; yokuş yönü = hatanın azaldığı yön; adım büyüklüğü = öğrenme hızı.</text>
