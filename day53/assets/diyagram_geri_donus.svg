<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06121F"/><stop offset="0.6" stop-color="#0A2A3D"/><stop offset="1" stop-color="#0B4A5A"/></linearGradient>
<linearGradient id="baslik" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FDE68A"/><stop offset="0.5" stop-color="#FFFFFF"/><stop offset="1" stop-color="#7DD3FC"/></linearGradient>
<linearGradient id="cubuk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#C2410C"/></linearGradient>
<linearGradient id="cubukN" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#047857"/></linearGradient>
<filter id="parilti" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ok" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#CBD5E1"/></marker>
<marker id="okA" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes yan{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
</style>
</defs>
<rect width="1600" height="400" rx="26" fill="url(#bg)"/>
<text x="800" y="62" text-anchor="middle" font-size="36" class="b" fill="url(#baslik)">Gidiş-dönüş: model dönüşmüş dünyada çalışır, sonuç TL'ye çevrilir</text><rect x="90" y="160" width="300" height="110" rx="16" fill="#0B1026" stroke="#FF7A59" stroke-width="2.5"/><text x="240.0" y="216.0" text-anchor="middle" font-size="22" class="b t">Ham prim</text><text x="240.0" y="239.0" text-anchor="middle" font-size="16" class="k">ör. 16.885 $</text><rect x="480" y="160" width="300" height="110" rx="16" fill="#0B1026" stroke="#FBBF24" stroke-width="2.5"/><text x="630.0" y="216.0" text-anchor="middle" font-size="22" class="b t">Dönüşmüş prim</text><text x="630.0" y="239.0" text-anchor="middle" font-size="16" class="k">λ ile çan benzeri</text><rect x="870" y="160" width="300" height="110" rx="16" fill="#0B1026" stroke="#34D399" stroke-width="2.5"/><text x="1020.0" y="216.0" text-anchor="middle" font-size="22" class="b t">Model tahmini</text><text x="1020.0" y="239.0" text-anchor="middle" font-size="16" class="k">dönüşmüş dünyada</text><rect x="1260" y="160" width="250" height="110" rx="16" fill="#0B1026" stroke="#38BDF8" stroke-width="2.5"/><text x="1385.0" y="216.0" text-anchor="middle" font-size="22" class="b t">Geri dönüş</text><text x="1385.0" y="239.0" text-anchor="middle" font-size="16" class="k">tahmin $ olur</text><line x1="390" y1="215" x2="478" y2="215" stroke="#CBD5E1" stroke-width="3" class=akis marker-end="url(#ok)"/><line x1="780" y1="215" x2="868" y2="215" stroke="#CBD5E1" stroke-width="3" class=akis marker-end="url(#ok)"/><line x1="1170" y1="215" x2="1258" y2="215" stroke="#CBD5E1" stroke-width="3" class=akis marker-end="url(#ok)"/><path d="M1385 280 C1385 360 240 360 240 282" fill="none" stroke="#FBBF24" stroke-width="3" class="akis" marker-end="url(#okA)"/><text x="800" y="352" text-anchor="middle" font-size="20" class="k">Ters dönüşüm gidiş yolunun tam tersidir; hata ~10⁻¹²</text>
</svg>