 rx="16" fill="#0B1026" stroke="#FBBF24" stroke-width="2.5"/><text x="1220.5" y="227.0" text-anchor="middle" font-size="17" class="b t">Ayar</text><line x1="1291" y1="220" x2="1325" y2="220" stroke="#CBD5E1" stroke-width="3" class=akis marker-end="url(#ok)"/><rect x="1325" y="170" width="141" height="100" rx="16" fill="#0B1026" stroke="#34D399" stroke-width="2.5"/><text x="1395.5" y="227.0" text-anchor="middle" font-size="17" class="b t">Test</text>
