r ve pozitif</text><text x="450" y="150" text-anchor="middle" font-size="19" fill="#FF7A59" class="b">✖ negatif / sıfır: Box-Cox hata verir</text><rect x="520" y="340" width="560" height="70" rx="16" fill="#0B1026" stroke="#FBBF24" stroke-width="2.5"/><text x="800.0" y="382.0" text-anchor="middle" font-size="21" class="b t">Sıfır var mı? → Yeo-Johnson</text>
