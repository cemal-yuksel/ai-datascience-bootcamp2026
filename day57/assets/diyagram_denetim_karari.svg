ne x1="938" y1="255" x2="961" y2="255" stroke="#22D3EE" stroke-width="3" marker-end="url(#ok)" class="akis"/><rect x="965" y="130" width="275" height="250" rx="16" fill="#0B1026" stroke="#34D399" stroke-width="2.5"/><text x="1102.5" y="170" font-size="23" font-weight="800" text-anchor="middle" fill="#34D399">Alan bütçesi</text><text x="1102.5" y="208" font-size="19" text-anchor="middle" class="t">Ekipler X km² tarar</text><text x="1102.5" y="239" font-size="19" text-anchor="middle" class="t">en verimli odaklardan başla</text><line x1="1243" y1="255" x2="1266" y2="255" stroke="#34D399" stroke-width="3" marker-end="url(#ok)" class="akis"/><rect x="1270" y="130" width="275" height="250" rx="16" fill="#0B1026" stroke="#A78BFA" stroke-width="2.5"/><text x="1407.5" y="170" font-size="23" font-weight="800" text-anchor="middle" fill="#A78BFA">Test ile doğrula</text><text x="1407.5" y="208" font-size="19" text-anchor="middle" class="t">Aynı bütçe:</text><text x="1407.5" y="239" font-size="19" text-anchor="middle" class="t">odak ↔ mahalle ↔ rastgele</text>
