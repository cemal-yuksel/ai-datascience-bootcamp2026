xt x="1180.0" y="252" font-size="20" text-anchor="middle" class="t">Issızlıkta: mesafe şişer → kolay birleşmez</text><text x="1180.0" y="284" font-size="20" text-anchor="middle" class="t">Sonuç: gürültü, kümeleri birbirine 'köprü' kuramaz</text>
