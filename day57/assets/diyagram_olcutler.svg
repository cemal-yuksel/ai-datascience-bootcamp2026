ı</text><rect x="1200" y="120" width="350" height="330" rx="16" fill="#0B1026" stroke="#FBBF24" stroke-width="2.5"/><text x="1375.0" y="160" font-size="27" font-weight="800" text-anchor="middle" fill="#FBBF24">ARI (etiket varsa)</text><text x="1375.0" y="198" font-size="20" text-anchor="middle" class="t">Gerçek gruplarla uyum</text><text x="1375.0" y="230" font-size="20" text-anchor="middle" class="t">0 = rastgele, 1 = birebir</text><text x="1375.0" y="262" font-size="20" text-anchor="middle" class="t">Yalnızca doğrulamada</text>
