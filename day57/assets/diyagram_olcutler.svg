<style>
.t{fill:#E2E8F0}.k{fill:#94A3B8}.b{font-weight:700}
@keyframes yuz{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes yan{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes akis{to{stroke-dashoffset:-40}}
@keyframes nefes{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes halka{0%{transform:scale(.2);opacity:.9}70%{opacity:.35}100%{transform:scale(1);opacity:0}}
@keyframes yak{0%,15%{fill:#475569}30%,85%{fill:var(--r)}100%{fill:#475569}}
@keyframes suyu{0%,100%{transform:translateY(0)}50%{transform:translateY(var(--d))}}
@keyframes cizgi{0%{stroke-dashoffset:100}40%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:100}}
.yuz{animation:yuz 4s ease-in-out infinite}.yan{animation:yan 3s ease-in-out infinite}
.akis{stroke-dasharray:8 8;animation:akis 1.2s linear infinite}
.nefes{transform-box:fill-box;transform-origin:center;animation:nefes 3s ease-in-out infinite}
.halka{transform-box:fill-box;transform-origin:center;animation:halka 3.2s ease-out infinite}
.yak{animation:yak 6s ease-in-out infinite}
</style>
