<radialGradient id="haleP" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#F472B6" stop-opacity="0.5"/><stop offset="1" stop-color="#F472B6" stop-opacity="0"/></radialGradient>
