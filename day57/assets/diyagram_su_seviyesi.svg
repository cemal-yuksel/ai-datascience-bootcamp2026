ill="#F472B6" font-weight="700">tek bir seviyede</tspan> dondurur (sabit eps)</text><text x="130" y="182" font-size="20" class="t">HDBSCAN: <tspan fill="#34D399" font-weight="700">tüm seviyeleri</tspan> izler, kararlı adaları seçer</text>
