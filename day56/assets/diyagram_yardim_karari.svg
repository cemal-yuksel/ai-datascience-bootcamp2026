xt><text x="1385.0" y="277" font-size="18" fill="#CBD5E1" text-anchor="middle" >+ konsensüs oyu</text><text x="1385.0" y="304" font-size="18" fill="#CBD5E1" text-anchor="middle" >→ saha ekibine</text><line x1="395" y1="320" x2="445" y2="320" stroke="#FBBF24" stroke-width="3" marker-end="url(#okA)" class="akis"/><line x1="785" y1="320" x2="835" y2="320" stroke="#FBBF24" stroke-width="3" marker-end="url(#okA)" class="akis"/><line x1="1175" y1="320" x2="1225" y2="320" stroke="#FBBF24" stroke-width="3" marker-end="url(#okA)" class="akis"/>
